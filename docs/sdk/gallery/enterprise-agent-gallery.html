<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Enterprise Agent Gallery</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Noto+Sans+JP:wght@400;500;700&display=swap">
<style>
/* Layout: a technical-document page. Hero → benchmark matrix → SDK pieces → ten use-case dossiers → cross-cutting gaps.
   Tokens follow sites/lp/assets/site.css (the landing-page system): paper neutrals, one action blue, ok / caveat semantics. */
:root {
  --action: #2f5fd0; --action-soft: #eaf0ff; --action-ink: #1f46a8;
  --ok: #1a7f4b; --ok-soft: #e6f4ec;
  --caveat: #8f5208; --caveat-soft: #fdf1e0;
  --gap: #a3361d; --gap-soft: #fbe9e4;
  --ink: #171614; --ink-2: #45433d; --ink-3: #6b6860;
  --rule: #e3e0da; --rule-strong: #cfcbc2;
  --paper: #faf9f7; --paper-2: #f4f3f0; --paper-3: #eceae5; --surface: #ffffff;
  --code-bg: #f4f3f0; --code-comment: #6b6860; --code-key: #2f5fd0; --code-str: #1a7f4b;
  --e1: 0 1px 2px rgba(24,23,20,.05), 0 4px 12px rgba(24,23,20,.05);
  --sans: "Inter", "Noto Sans JP", system-ui, -apple-system, "Segoe UI", "Hiragino Sans", "Yu Gothic UI", sans-serif;
  --mono: "JetBrains Mono", ui-monospace, Consolas, Menlo, monospace;
  --shell: 1200px; --measure: 720px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --action: #7ea2f5; --action-soft: #1d2740; --action-ink: #a9c1fa;
  --ok: #5cc98d; --ok-soft: #14291e; --caveat: #e7a54d; --caveat-soft: #2e2212; --gap: #f08a70; --gap-soft: #321a14;
  --ink: #f2f0ec; --ink-2: #cfccc4; --ink-3: #a29e95; --rule: #2e2d29; --rule-strong: #45433d;
  --paper: #141412; --paper-2: #1b1a18; --paper-3: #23221f; --surface: #1d1c1a;
  --code-bg: #10100f; --code-comment: #8d897f; --code-key: #9bb7f7; --code-str: #7fd3a3;
  --e1: 0 1px 2px rgba(0,0,0,.4); color-scheme: dark; } }
:root[data-theme="dark"] {
  --action: #7ea2f5; --action-soft: #1d2740; --action-ink: #a9c1fa;
  --ok: #5cc98d; --ok-soft: #14291e; --caveat: #e7a54d; --caveat-soft: #2e2212; --gap: #f08a70; --gap-soft: #321a14;
  --ink: #f2f0ec; --ink-2: #cfccc4; --ink-3: #a29e95; --rule: #2e2d29; --rule-strong: #45433d;
  --paper: #141412; --paper-2: #1b1a18; --paper-3: #23221f; --surface: #1d1c1a;
  --code-bg: #10100f; --code-comment: #8d897f; --code-key: #9bb7f7; --code-str: #7fd3a3;
  --e1: 0 1px 2px rgba(0,0,0,.4); color-scheme: dark; }

* { box-sizing: border-box; }
body { background: var(--paper); color: var(--ink-2); font: 400 15px/1.7 var(--sans); margin: 0; }
a { color: var(--action); text-underline-offset: 2px; }
a:focus-visible, button:focus-visible { outline: 2px solid var(--action); outline-offset: 2px; border-radius: 4px; }
h1, h2, h3, h4 { color: var(--ink); text-wrap: balance; margin: 0; }
code, .mono { font-family: var(--mono); font-size: .9em; }
.shell { max-width: var(--shell); margin: 0 auto; padding-inline: 24px; }
@media (max-width: 600px) { .shell { padding-inline: 16px; } }

/* top bar */
.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 10; background: color-mix(in srgb, var(--paper) 92%, transparent); backdrop-filter: blur(6px); border-bottom: 1px solid var(--rule); }
.bar .shell { display: flex; align-items: center; gap: 16px; min-height: 52px; flex-wrap: wrap; padding-block: 6px; }
.brand { font: 600 13px/1 var(--mono); letter-spacing: .04em; color: var(--ink); }
.bar nav { display: flex; gap: 14px; flex-wrap: wrap; margin-left: auto; font-size: 13px; }
.bar nav a { color: var(--ink-3); text-decoration: none; }
.bar nav a:hover { color: var(--ink); }
.lang { display: inline-flex; border: 1px solid var(--rule-strong); border-radius: 999px; overflow: hidden; }
.lang button { font: 500 12px/1 var(--mono); padding: 7px 11px; background: transparent; color: var(--ink-3); border: 0; cursor: pointer; }
.lang button[aria-pressed="true"] { background: var(--ink); color: var(--paper); }

/* hero */
.hero { padding-block: 64px 40px; }
.eyebrow { font: 600 12px/1 var(--mono); letter-spacing: .14em; text-transform: uppercase; color: var(--action); margin-bottom: 16px; }
.hero h1 { font-size: clamp(30px, 4.2vw, 50px); line-height: 1.12; letter-spacing: -.028em; font-weight: 650; max-width: 22ch; }
:lang(ja) .hero h1 { letter-spacing: -.01em; max-width: 24ch; }
.lead { font-size: 17px; max-width: var(--measure); margin: 20px 0 0; }
.legend { display: flex; flex-wrap: wrap; gap: 10px 22px; margin-top: 28px; font-size: 13px; }
.legend > span { display: inline-flex; align-items: center; gap: 8px; }
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 0; margin-top: 36px; border-top: 1px solid var(--rule); }
.stat { padding: 18px 20px 18px 0; border-bottom: 1px solid var(--rule); }
.stat b { display: block; font: 600 26px/1.1 var(--mono); color: var(--ink); font-variant-numeric: tabular-nums; }
.stat span { font-size: 13px; color: var(--ink-3); }
.stat a { font-size: 12px; }

/* status marks */
.mk { display: inline-grid; place-items: center; width: 22px; height: 22px; border-radius: 6px; font: 600 12px/1 var(--mono); flex: none; }
.mk.ok { background: var(--ok-soft); color: var(--ok); }
.mk.work { background: var(--caveat-soft); color: var(--caveat); }
.mk.gap { background: var(--gap-soft); color: var(--gap); }
.mk.na { color: var(--rule-strong); }

section.block { padding-block: 56px; border-top: 1px solid var(--rule); }
section.alt { background: var(--paper-2); }
.sec-head { display: grid; gap: 10px; margin-bottom: 28px; max-width: var(--measure); }
.sec-head h2 { font-size: clamp(24px, 3vw, 34px); letter-spacing: -.02em; line-height: 1.2; font-weight: 650; }
.sec-head p { margin: 0; }

/* matrix */
.scroll { overflow-x: auto; border: 1px solid var(--rule); background: var(--surface); }
table.matrix { border-collapse: collapse; width: 100%; min-width: 980px; font-size: 13px; }
.matrix th, .matrix td { border-bottom: 1px solid var(--rule); padding: 8px 6px; text-align: center; }
.matrix thead th { font: 500 11px/1.3 var(--sans); color: var(--ink-3); vertical-align: bottom; height: 92px; }
.matrix thead th .ref { display: block; font-family: var(--mono); color: var(--ink-3); margin-top: 4px; font-size: 10px; }
.matrix th.uc, .matrix td.uc { text-align: left; padding-left: 14px; white-space: nowrap; }
.matrix td.uc a { color: var(--ink); text-decoration: none; font-weight: 600; }
.matrix td.uc a:hover { color: var(--action); }
.matrix td.uc small { display: block; color: var(--ink-3); font-weight: 400; font-size: 11px; }
.matrix tbody tr:hover { background: var(--paper-2); }
.matrix td.score { font: 600 12px var(--mono); font-variant-numeric: tabular-nums; white-space: nowrap; color: var(--ink); }
.matrix tfoot td { font: 600 11px var(--mono); color: var(--ink-3); border-bottom: 0; }
.verdict { display: inline-block; font: 600 11px/1 var(--mono); padding: 5px 8px; border-radius: 6px; white-space: nowrap; }
.verdict.ok { background: var(--ok-soft); color: var(--ok); }
.verdict.work { background: var(--caveat-soft); color: var(--caveat); }
.verdict.gap { background: var(--gap-soft); color: var(--gap); }

/* building blocks */
.pieces { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 12px; }
.piece { background: var(--surface); border: 1px solid var(--rule); border-radius: 10px; padding: 14px 16px; display: grid; gap: 6px; align-content: start; }
.piece header { display: flex; align-items: center; gap: 8px; }
.piece h4 { font: 600 13px/1.3 var(--mono); }
.piece p { margin: 0; font-size: 13px; line-height: 1.6; }
.piece .api { font: 400 11.5px/1.5 var(--mono); color: var(--ink-3); overflow-wrap: anywhere; }

/* use-case dossiers */
.index { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 8px; margin-bottom: 8px; }
.index a { display: flex; gap: 10px; align-items: baseline; padding: 10px 12px; border: 1px solid var(--rule); border-radius: 10px; background: var(--surface); text-decoration: none; color: var(--ink); font-size: 13px; }
.index a:hover { border-color: var(--rule-strong); }
.index a .n { font: 600 12px var(--mono); color: var(--ink-3); }
.uc-sec { padding-block: 48px; border-top: 1px solid var(--rule); scroll-margin-top: 64px; }
.uc-head { display: grid; grid-template-columns: auto 1fr auto; gap: 6px 18px; align-items: start; }
.uc-num { font: 600 13px/1 var(--mono); color: var(--action); padding-top: 9px; }
.uc-head h3 { font-size: clamp(22px, 2.6vw, 28px); letter-spacing: -.015em; line-height: 1.25; font-weight: 650; }
.uc-head .sub { color: var(--ink-3); font-size: 14px; margin-top: 4px; }
.uc-head .verdict { margin-top: 8px; }
@media (max-width: 640px) { .uc-head { grid-template-columns: 1fr; } .uc-num { padding-top: 0; } }
.uc-grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.15fr); gap: 28px 40px; margin-top: 26px; }
@media (max-width: 980px) { .uc-grid { grid-template-columns: minmax(0, 1fr); } }
.label { font: 600 11px/1 var(--mono); letter-spacing: .12em; text-transform: uppercase; color: var(--ink-3); margin: 0 0 12px; }
.pain { margin: 0; }
.evidence { margin: 12px 0 0; padding: 0; list-style: none; display: grid; gap: 6px; font-size: 13px; }
.evidence li { padding-left: 14px; position: relative; }
.evidence li::before { content: ""; position: absolute; left: 0; top: .72em; width: 6px; height: 1px; background: var(--ink-3); }
ol.flow { margin: 0; padding: 0; list-style: none; counter-reset: s; display: grid; gap: 0; }
ol.flow li { counter-increment: s; display: grid; grid-template-columns: 28px 1fr; gap: 10px; padding: 8px 0; border-bottom: 1px dashed var(--rule); font-size: 14px; }
ol.flow li::before { content: counter(s); font: 600 12px/22px var(--mono); color: var(--action); text-align: center; border: 1px solid var(--rule-strong); border-radius: 999px; width: 22px; height: 22px; }

/* architecture diagram */
.arch { border: 1px solid var(--rule-strong); background: var(--surface); padding: 14px; display: grid; gap: 10px; font-size: 12.5px; }
.arch .row { display: grid; grid-template-columns: 74px 1fr; gap: 10px; align-items: start; }
.arch .rl { font: 600 10.5px/1.3 var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--ink-3); padding-top: 7px; }
.arch .chips { display: flex; flex-wrap: wrap; gap: 6px; min-width: 0; }
.chip { display: inline-grid; gap: 1px; padding: 6px 9px; border-radius: 6px; border: 1px solid; max-width: 100%; }
.chip b { font: 600 11.5px/1.3 var(--mono); overflow-wrap: anywhere; }
.chip i { font-style: normal; font-size: 11.5px; line-height: 1.4; }
.chip.ok { border-color: color-mix(in srgb, var(--ok) 35%, transparent); background: var(--ok-soft); color: var(--ink); }
.chip.ok b { color: var(--ok); }
.chip.work { border-color: color-mix(in srgb, var(--caveat) 35%, transparent); background: var(--caveat-soft); color: var(--ink); }
.chip.work b { color: var(--caveat); }
.chip.gap { border-color: color-mix(in srgb, var(--gap) 35%, transparent); background: var(--gap-soft); color: var(--ink); border-style: dashed; }
.chip.gap b { color: var(--gap); }
.arch .agent { border: 1.5px solid var(--ink); border-radius: 6px; padding: 8px 10px; background: var(--paper-2); }
.arch .agent b { font: 600 12.5px var(--mono); color: var(--ink); }
.arch .agent i { display: block; font-style: normal; color: var(--ink-3); font: 400 11.5px/1.5 var(--mono); overflow-wrap: anywhere; }
.arch .down { text-align: center; color: var(--ink-3); font: 12px var(--mono); line-height: 1; margin: -4px 0 -4px 84px; }

pre.code { margin: 0; background: var(--code-bg); border: 1px solid var(--rule); padding: 14px 16px; overflow-x: auto; font: 400 12.5px/1.6 var(--mono); color: var(--ink); tab-size: 2; }
pre.code .c { color: var(--code-comment); }
pre.code .k { color: var(--code-key); }
pre.code .s { color: var(--code-str); }
.file { font: 500 11px var(--mono); color: var(--ink-3); background: var(--paper-3); border: 1px solid var(--rule); border-bottom: 0; padding: 5px 10px; display: inline-block; }

table.gaps { width: 100%; border-collapse: collapse; font-size: 13.5px; }
.gaps td { padding: 10px 8px 10px 0; border-bottom: 1px solid var(--rule); vertical-align: top; }
.gaps td:first-child { width: 30px; }
.gaps td b { color: var(--ink); font-weight: 600; display: block; margin-bottom: 2px; }
.gaps .ref { font: 500 11px var(--mono); color: var(--ink-3); white-space: nowrap; }
.span2 { grid-column: 1 / -1; }

/* cross-cutting */
.xgaps { display: grid; gap: 0; border-top: 1px solid var(--rule); }
.xgap { display: grid; grid-template-columns: 34px minmax(0, 1fr) 210px; gap: 16px; padding: 16px 0; border-bottom: 1px solid var(--rule); align-items: start; }
.xgap h4 { font-size: 15px; font-weight: 600; margin-bottom: 4px; }
.xgap p { margin: 0; font-size: 13.5px; }
.xgap .meter { display: grid; gap: 6px; font: 500 11px var(--mono); color: var(--ink-3); }
.xgap .dots { display: flex; gap: 3px; }
.xgap .dots i { width: 14px; height: 14px; border-radius: 3px; background: var(--paper-3); }
.xgap .dots i.on { background: var(--gap); }
.xgap .dots i.on.w { background: var(--caveat); }
@media (max-width: 720px) { .xgap { grid-template-columns: 34px minmax(0, 1fr); } .xgap .meter { grid-column: 2; } }
.note { font-size: 12.5px; color: var(--ink-3); max-width: var(--measure); }
footer { padding-block: 40px 64px; border-top: 1px solid var(--rule); font-size: 12.5px; color: var(--ink-3); }
footer ul { padding-left: 18px; margin: 8px 0 0; display: grid; gap: 4px; }
@media (prefers-reduced-motion: no-preference) { html { scroll-behavior: smooth; } }
</style>
</head>
<body>

<header class="bar">
  <div class="shell">
    <span class="brand">AGENT WORKSPACE · GALLERY</span>
    <nav aria-label="Sections">
      <a href="#matrix" data-i18n="navMatrix">Benchmark</a>
      <a href="#pieces" data-i18n="navPieces">SDK pieces</a>
      <a href="#cases" data-i18n="navCases">Use cases</a>
      <a href="#findings" data-i18n="navFind">Findings</a>
      <a href="#gaps" data-i18n="navGaps">Gaps</a>
    </nav>
    <div class="lang" role="group" aria-label="Language">
      <button type="button" id="lang-ja" aria-pressed="true">日本語</button>
      <button type="button" id="lang-en" aria-pressed="false">EN</button>
    </div>
  </div>
</header>

<main id="app"></main>

import json, sys, openpyxl

def read_sheet(path, sheet, header_rows, mapping):
    ws = openpyxl.load_workbook(path, data_only=True)[sheet]
    for r in ws.iter_rows(min_row=header_rows + 1):
        row = {}
        for col, field in mapping.items():          # 例 {"C": "売上高_千円"}
            cell = r[openpyxl.utils.column_index_from_string(col) - 1]
            row[field] = cell.value
            row[field + "@src"] = f"{path}!{sheet}!{cell.coordinate}"
        yield row

plan = json.load(sys.stdin)        # エージェントが作り、利用者が承認した計画
rows = [r for f in plan["files"] for r in read_sheet(**f)]

const SOURCES = [

let lang = 'ja';
try { const saved = localStorage.getItem('gallery-lang'); if (saved === 'en' || saved === 'ja') lang = saved; } catch (e) { /* storage unavailable */ }

const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const t = (o) => (o && typeof o === 'object' && 'ja' in o ? o[lang] : o);
const mk = (st) => `<span class="mk ${st}" aria-label="${st}">${S[st]}</span>`;
const vlabel = { ok: { ja: '今日つくれる', en: 'Buildable today' }, work: { ja: '自前コードで可能', en: 'With your own code' }, gap: { ja: 'ギャップ大', en: 'Major gaps' } };

function score(m) {
  const need = m.filter((x) => x !== 'na');
  const v = need.reduce((a, x) => a + (x === 'ok' ? 1 : x === 'work' ? 0.5 : 0), 0);
  return Math.round((v / need.length) * 100);
}

function codeBlock(code) {
  // light highlighting: comments, quoted strings, a few keywords
  const lines = code.split('\n').map((raw) => {
    let comment = '';
    let body = raw;
    const idx = (() => {
      let inS = null;
      for (let i = 0; i < raw.length; i++) {
        const c = raw[i];
        if (inS) { if (c === inS && raw[i - 1] !== '\\') inS = null; continue; }
        if (c === "'" || c === '"' || c === '`') { inS = c; continue; }
        if (c === '/' && raw[i + 1] === '/' && raw[i - 1] !== ':') return i;
        if (c === '#' && (i === 0 || raw[i - 1] === ' ')) return i;
      }
      return -1;
    })();
    if (idx >= 0) { body = raw.slice(0, idx); comment = raw.slice(idx); }
    let h = esc(body)
      .replace(/(&#39;|')((?:[^'\\]|\\.)*?)'/g, "<span class=\"s\">'$2'</span>")
      .replace(/\b(import|from|export|default|const|await|async|function|if|return|throw|for|def|yield|in)\b/g, '<span class="k">$1</span>');
    return h + (comment ? `<span class="c">${esc(comment)}</span>` : '');
  });
  return lines.join('\n');
}

function chips(list) {
  return list.map(([st, name, note]) => `<span class="chip ${st}"><b>${esc(name)}</b><i>${esc(t(note))}</i></span>`).join('');
}

function arch(a) {
  const row = (label, inner) => inner ? `<div class="row"><div class="rl">${esc(t(T[label]))}</div><div class="chips">${inner}</div></div>` : '';
  return `<div class="arch" role="img" aria-label="${esc(t(T.lArch))}">
    ${row('rEntry', chips(a.entry))}
    <div class="down" aria-hidden="true">↓</div>
    <div class="row"><div class="rl">${esc(t(T.rAgent))}</div><div class="agent"><b>${esc(a.agent[0])}</b><i>${esc(a.agent[1])}</i></div></div>
    ${row('rSkills', chips(a.skills))}
    ${row('rTools', chips(a.tools))}
    ${row('rFiles', chips(a.files))}
    ${row('rQuality', chips(a.quality))}
  </div>`;
}

function render() {
  document.documentElement.lang = lang;

  document.getElementById('lang-en').setAttribute('aria-pressed', String(lang === 'en'));

  const colTotals = CAPS.map((_, i) => UC.filter((u) => u.m[i] === 'ok').length + '/' + UC.filter((u) => u.m[i] !== 'na').length);

  </div>

  <section class="block alt" id="matrix">
    <div class="shell">
      <div class="sec-head"><div class="eyebrow">Benchmark</div><h2>${esc(t(T.matrixH))}</h2><p>${esc(t(T.matrixP))}</p></div>
      <div class="scroll">
        <table class="matrix">
          <thead><tr><th class="uc">${esc(t(T.ucCol))}</th>${CAPS.map((c) => `<th scope="col">${esc(c[lang])}<span class="ref">${esc(c.ref)}</span></th>`).join('')}<th>${esc(t(T.scoreCol))}</th><th>${esc(t(T.verdictCol))}</th></tr></thead>
          <tbody>${UC.map((u) => `<tr><td class="uc"><a href="#${u.id}">${u.no}. ${esc(u[lang])}</a><small>${esc(t(u.vnote))}</small></td>${u.m.map((x) => `<td>${mk(x)}</td>`).join('')}<td class="score">${score(u.m)} <span style="color:var(--ink-3);font-weight:400">(${score(u.est)})</span></td><td><span class="verdict ${u.verdict}">${esc(t(vlabel[u.verdict]))}</span></td></tr>`).join('')}</tbody>
          <tfoot><tr><td class="uc">${esc(t(T.colTotals))}</td>${colTotals.map((x) => `<td>${x}</td>`).join('')}<td></td><td></td></tr></tfoot>
        </table>
      </div>
    </div>
  </section>

  <section class="block" id="pieces">
    <div class="shell">
      <div class="sec-head"><div class="eyebrow">Building blocks</div><h2>${esc(t(T.piecesH))}</h2><p>${esc(t(T.piecesP))}</p></div>
      <div class="pieces">${PIECES.map((p) => `<div class="piece"><header>${mk(p.st)}<h4>${esc(p.name)}</h4></header><p>${esc(p[lang])}</p><div class="api">${esc(p.api)}</div></div>`).join('')}</div>
    </div>

  <section class="block alt" id="cases">
    <div class="shell">

    </div>
  </section>

  ${UC.map((u, i) => `
  <section class="uc-sec ${i % 2 ? 'alt' : ''}" id="${u.id}" style="${i % 2 ? 'background:var(--paper-2)' : ''}">
    <div class="shell">

  </section>`).join('')}

  <section class="block alt" id="findings">
    <div class="shell">
      <div class="sec-head"><div class="eyebrow">Findings</div><h2>${esc(t(T.findH))}</h2><p>${esc(t(T.findP))}</p></div>
      <div class="xgaps">${FINDINGS.map((f, i) => `<div class="xgap" style="grid-template-columns:34px minmax(0,1fr)"><div class="uc-num" style="padding-top:2px">${String(i + 1).padStart(2, '0')}</div><div><h4>${esc(f[lang][0])}</h4><p>${esc(f[lang][1])}</p></div></div>`).join('')}</div>
    </div>
  </section>

  <section class="block" id="gaps">
    <div class="shell">
      <div class="sec-head"><div class="eyebrow">Cross-cutting</div><h2>${esc(t(T.gapsH))}</h2><p>${esc(t(T.gapsP))}</p></div>
      <div class="xgaps">${XGAPS.slice().sort((a, b) => (b.u.length + b.w.length * 0.5) - (a.u.length + a.w.length * 0.5)).map((g, i) => `
        <div class="xgap">
          <div class="uc-num" style="padding-top:2px">${String(i + 1).padStart(2, '0')}</div>
          <div><h4>${esc(g[lang])}</h4><p>${esc(lang === 'ja' ? g.pja : g.pen)}</p></div>
          <div class="meter"><span>${esc(g.ref)} · ${g.u.length + g.w.length} ${esc(t(T.uses))}</span>
            <div class="dots" aria-hidden="true">${UC.map((u) => `<i class="${g.u.includes(u.no) ? 'on' : g.w.includes(u.no) ? 'on w' : ''}" title="${u.no}"></i>`).join('')}</div></div>
        </div>`).join('')}
      </div>
    </div>
  </section>

  <footer>
    <div class="shell">
      <p class="note">${esc(t(T.footNote))}</p>
      <p class="label" style="margin-top:16px">${esc(t(T.srcH))}</p>
      <ul>${SOURCES.map(([n, u]) => `<li><a href="${u}" target="_blank" rel="noopener">${esc(n)}</a></li>`).join('')}</ul>
    </div>
  </footer>`;
  document.getElementById('app').innerHTML = html;
}

function setLang(l) { lang = l; try { localStorage.setItem('gallery-lang', l); } catch (e) { /* storage unavailable */ } render(); }
document.getElementById('lang-ja').addEventListener('click', () => setLang('ja'));
document.getElementById('lang-en').addEventListener('click', () => setLang('en'));
render();
})();
</script>
