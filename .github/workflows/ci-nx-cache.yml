# This repository's Nx remote cache (infra/nx-cache, docs/adr/0110). Install-free: the server is
# zero-dependency Node. The config guard (scripts/ci/check-nx-cache-config.mjs) is not here — it
# runs in ci.yml's fast-checks on every pull request, and its tests run with the `tests` project.
#
#   server      the cache server's contract / race / streaming / storage-failure / OIDC suite,
#               and the container image build
#   live-trust  against the DEPLOYED server: exchanges this job's real GitHub OIDC token through
#               .github/actions/nx-remote-cache and proves the role the SERVER granted (the
#               action's `role` output, never the plan): a `read` grant's PUT must get 403; a
#               `write` grant (a push to `main`, and since ADR-0110 Amendment 2026-11-19 a
#               same-repository pull request) must PUT 200, a duplicate PUT must get 409 and the
#               bytes must round-trip. This is the acceptance test for "no run can replace an
#               entry already in the cache" and for the read-only roles.
#
# Not required by ci-success on purpose: it is path-filtered, and an unreachable cache must never
# turn CI red (the live check then warns and proves nothing). The guarantee it measures is enforced
# by the server, not by this workflow. See docs/40-operate/operations/ci.md "Nx remote cache".
name: CI Nx remote cache

on:
  push:
    branches: [main]
    paths:
      - 'infra/nx-cache/**'
      - '.github/actions/nx-remote-cache/**'
      - '.github/workflows/ci-nx-cache.yml'
      - 'scripts/ci/**'
      - 'nx.json'
  pull_request:
    branches: [main]
    paths:
      - 'infra/nx-cache/**'
      - '.github/actions/nx-remote-cache/**'
      - '.github/workflows/ci-nx-cache.yml'
      - 'scripts/ci/**'
      - 'nx.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Same plan, same expression, as ci.yml.
  NX_REMOTE_CACHE_KIND: ${{ (vars.INDX_NX_REMOTE_CACHE_ENABLED != 'true' || vars.NX_SELF_HOSTED_REMOTE_CACHE_SERVER == '') && 'off' || (((github.event_name == 'push' || github.event_name == 'schedule') && github.ref == 'refs/heads/main') || (github.event_name == 'merge_group' && startsWith(github.ref, 'refs/heads/gh-readonly-queue/main/')) || (github.event_name == 'pull_request' && github.base_ref == 'main' && github.event.pull_request.head.repo.full_name == github.repository)) && 'write' || 'read' }}

jobs:
  server:
    name: cache server tests · image
    if: github.repository_owner == 'INDXDev'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24

      # --expose-gc: the streaming test samples retained memory after GC to prove a 256 MiB
      # artifact never sits in the server's memory. gcs.integration.test.mjs skips itself here:
      # no bucket credentials in CI (it is run by hand, infra/nx-cache/README.md "Testing").
      - name: Contract, race, streaming, storage-failure and OIDC tests
        run: node --expose-gc --test 'infra/nx-cache/test/*.test.mjs'

      - name: Container image builds
        run: docker build -t nx-cache:ci infra/nx-cache

  live-trust:
    name: live trust check (deployed cache)
    if: github.repository_owner == 'INDXDev'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Assert fork pull_request runs cannot select remote-cache write
        env:
          EVENT_NAME: ${{ github.event_name }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          BASE_REPO: ${{ github.repository }}
        run: |
          if [ "$NX_REMOTE_CACHE_KIND" = "write" ]; then
            case "$EVENT_NAME" in
              push|schedule|merge_group) ;;
              pull_request) [ "$HEAD_REPO" = "$BASE_REPO" ] || { echo "::error::fork pull_request run ($HEAD_REPO) resolved to remote-cache kind 'write'"; exit 1; } ;;
              *) echo "::error::$EVENT_NAME event resolved to remote-cache kind 'write'"; exit 1 ;;
            esac
          fi

      - name: Connect to the remote cache
        id: cache
        uses: ./.github/actions/nx-remote-cache
        with:
          kind: ${{ env.NX_REMOTE_CACHE_KIND }}
          server: ${{ vars.NX_SELF_HOSTED_REMOTE_CACHE_SERVER }}

      # Probes with a key Nx can never produce (Nx hashes are digits only), so nothing here can
      # collide with or shadow a real artifact. It tests the role the SERVER granted (the action
      # already failed the job if that was more than the plan), so a server still on the main-only
      # policy (before the redeploy of ADR-0110 Amendment 2026-11-19) proves read-only here.
      - name: Prove the granted role server-side
        if: env.NX_REMOTE_CACHE_KIND != 'off'
        env:
          GRANTED: ${{ steps.cache.outputs.role }}
        run: |
          set -euo pipefail
          if [ -z "${NX_SELF_HOSTED_REMOTE_CACHE_ACCESS_TOKEN:-}" ]; then
            echo "::warning::no remote-cache token (cache unreachable or OIDC unavailable) — nothing to prove"
            exit 0
          fi
          S="$NX_SELF_HOSTED_REMOTE_CACHE_SERVER"
          auth="Authorization: Bearer $NX_SELF_HOSTED_REMOTE_CACHE_ACCESS_TOKEN"
          key="selftest-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          missing=$(curl -s -o /dev/null -w '%{http_code}' -H "$auth" "$S/v1/cache/${key}-missing")
          [ "$missing" = "404" ] || { echo "::error::GET of a missing key returned $missing, expected 404"; exit 1; }
          head -c 1048576 /dev/urandom > "$RUNNER_TEMP/body.bin"
          put=$(curl -s -o /dev/null -w '%{http_code}' -X PUT -H "$auth" -H 'Content-Type: application/octet-stream' --data-binary @"$RUNNER_TEMP/body.bin" "$S/v1/cache/$key")
          if [ "$GRANTED" = "read" ]; then
            [ "$put" = "403" ] || { echo "::error::a READ-role run could PUT (HTTP $put) — the server let an untrusted run write"; exit 1; }
            echo "::notice title=Live trust check::event=${{ github.event_name }} (planned '$NX_REMOTE_CACHE_KIND') got a read token; PUT → 403 as required"
          elif [ "$GRANTED" != "write" ]; then
            echo "::error::the cache action set a token but reported role '$GRANTED'"
            exit 1
          else
            [ "$put" = "200" ] || { echo "::error::write PUT returned $put"; exit 1; }
            again=$(curl -s -o /dev/null -w '%{http_code}' -X PUT -H "$auth" --data-binary @"$RUNNER_TEMP/body.bin" "$S/v1/cache/$key")
            [ "$again" = "409" ] || { echo "::error::second PUT of the same key returned $again, expected 409 (immutability)"; exit 1; }
            curl -fsS -H "$auth" "$S/v1/cache/$key" -o "$RUNNER_TEMP/back.bin"
            cmp "$RUNNER_TEMP/body.bin" "$RUNNER_TEMP/back.bin"
            echo "::notice title=Live trust check::event=${{ github.event_name }} wrote; duplicate → 409; round-trip byte-exact"
          fi
