name: Agent Store real-model verification

# R1 of the Agent Store (spec, "Real-model verification gate (R1)"): one run of each live entry's
# suggested prompt against real Claude in the store's staging deployment, judged by the catalog's
# moment check (tests/store/live-verify/). The `entries` input names the entries to verify
# (comma-separated slugs, so a batch verifies only its own); left empty, it verifies every live entry
# with no passing record for its current source hash (tests/store/live-verify/source-hash.ts). A slug
# that is not a live entry at the dispatched ref refuses the run before anything is spent. So does an
# entry whose source folder or catalog file differs between the checkout and the commit the latest
# successful staging deploy (store-deploy.yml on main) seeded its demo templates from: a record must
# verify the code the run exercised, so dispatch it on main after the deploy of that code. It SPENDS on a real model, so it runs on workflow_dispatch
# only, never on a pull request or a schedule, and only when the person who starts it types the
# approval into the `approve_spend` input. It is NOT a required check and no ci-success need.
#
# It needs three repository secrets, passed only to the step that runs the harness: the staging
# deployment's origin and a verification-workspace API key with the builder role (see the header of
# tests/store/live-verify/verify.ts). The run appends records to
# examples/store/catalog/real-model-runs.json and keeps that file as the `store-live-verify-evidence`
# artifact; a person reads it and commits it. Nothing here pushes.

on:
  workflow_dispatch:
    inputs:
      approve_spend:
        description: 'Type spend-approved to confirm a person has approved the real-model spend'
        required: true
        type: string
      entries:
        description: 'Comma-separated entry slugs to verify; empty for every live entry with no passing record for its current source'
        required: false
        default: ''
        type: string

concurrency:
  group: store-live-verify
  cancel-in-progress: false

permissions:
  contents: read
  # Reads the latest successful staging deploy's commit (gh run list), nothing else.
  actions: read

jobs:
  store-live-verify:
    name: real-model verification of the live entries
    if: github.repository_owner == 'INDXDev' && (inputs.approve_spend == 'spend-approved')
    runs-on: [self-hosted, ms-a2]
    timeout-minutes: 60
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # The deployed commit's trees, to compare each entry's source with the checkout's.
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24

      - name: Install
        timeout-minutes: 8
        run: pnpm install --frozen-lockfile

      - name: Build the SDK the harness uses
        timeout-minutes: 15
        run: scripts/ci/nx.sh run-many -t build --projects=@indx-workspace/contracts,@indx-workspace/sdk --output-style=static

      - name: Find the commit staging was deployed from
        id: deployed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          commit="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow store-deploy.yml --branch main --event push --status success --limit 1 --json headSha --jq '.[0].headSha // ""')"
          if [ -z "$commit" ]; then
            echo "::error::no successful staging deploy found"
            exit 1
          fi
          echo "commit=$commit" >> "$GITHUB_OUTPUT"

      - name: Run each live entry's prompt against real Claude in staging
        timeout-minutes: 40
        env:
          STORE_LIVE_VERIFY: ${{ inputs.approve_spend }}
          STORE_LIVE_VERIFY_ENVIRONMENT: staging
          STORE_LIVE_VERIFY_ENTRIES: ${{ inputs.entries }}
          STORE_LIVE_VERIFY_DEPLOYED_COMMIT: ${{ steps.deployed.outputs.commit }}
          STORE_LIVE_VERIFY_URL: ${{ secrets.STORE_STAGING_URL }}
          STORE_LIVE_VERIFY_API_KEY: ${{ secrets.STORE_VERIFY_API_KEY }}
        run: node tests/store/live-verify/run.ts

      - name: Keep the evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: store-live-verify-evidence
          path: examples/store/catalog/real-model-runs.json
          if-no-files-found: warn
