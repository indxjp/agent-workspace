name: Publish platform images

# Builds, signs, attests and pushes the platform container images to GHCR from an
# `images-v<version>` tag (issue #370, ADR-0086), so that `npm create @indx-workspace` can resolve
# every image it pins to a digest and `pnpm start` can pull them without credentials.
#
# The image list is `packages/cli/src/release-images.json` (what the generator pins) plus one
# runtime image per engine (ADR-0073), as `node infra/release/images.mjs` prints it; the tag must
# name the version that document carries. `infra/release/build-and-push.sh` builds linux/amd64 and
# linux/arm64 and pushes each image by digest only; it scans every platform with trivy, signs keyless
# with cosign and attaches the SPDX SBOM and SLSA provenance attestations `release.yml` verifies,
# and adds the `<version>` tags only after every image has passed. A tag that already exists is
# never moved (ADR-0086 D6). The only credential is this run's GITHUB_TOKEN.
#
# The publish job runs in the `images-publish` environment, which the Owner creates with a
# deployment tag rule `images-v*` (and reviewers, if wanted), as for `npm-publish`
# (docs/release/README.md, "Platform images").
#
# This is not the platform release (`release.yml`, `v*` tags), which verifies these images and
# publishes the release notes, nor the npm release (`publish-packages.yml`, `packages-v*` tags).
#
# A new GHCR package is private. `verify-public` fails, naming each package, until the Owner makes
# it public (docs/release/README.md, "Platform images"); after that, re-run the failed job only.

on:
  push:
    tags: ['images-v*']

concurrency:
  group: publish-images
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # The release gate (ADR-0053, Amendment 2026-10-24): the full CI, every tier, on the tagged
  # commit before anything is built for publishing. The heavy tier no longer runs in the merge
  # queue, so this is where a release proves it. The permissions are the most any ci.yml job asks for.
  ci:
    if: github.repository == 'indxjp/agent-workspace'
    uses: ./.github/workflows/ci.yml
    with:
      full: true
    permissions:
      contents: read
      actions: write
      id-token: write

  publish:
    if: github.repository == 'indxjp/agent-workspace'
    needs: ci
    # QEMU builds the arm64 half of every image, which is slow on a 2-vCPU runner; it runs only on
    # an images-v* tag, so the 180-minute budget is the price instead of a third-party runner.
    runs-on: ubuntu-latest
    environment: images-publish
    timeout-minutes: 180
    permissions:
      contents: read
      packages: write
      # Keyless cosign signing. The SBOM and provenance are cosign attestations stored beside
      # the image in GHCR (what release.yml verifies), not GitHub's attestations API, so the job
      # holds no `attestations: write`.
      id-token: write
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      # fetch-depth: 0 fetches every branch, so origin/main is here without a second, authenticated
      # fetch; no credential stays in the git config of a job that holds packages: write.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      # A tag can be pushed on any commit; only a commit already on main is published.
      - name: Start freeing disk for the Docker builds
        uses: ./.github/actions/free-disk

      - name: Refuse a tag whose commit is not on main
        run: |
          git rev-parse --verify --quiet refs/remotes/origin/main >/dev/null || { echo '::error::origin/main was not fetched'; exit 1; }
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$GITHUB_REF_NAME points at $GITHUB_SHA, which is not on main"
            exit 1
          fi
      # The release tooling uses Node built-ins only, so no dependency is installed in a job that
      # holds a package-write token.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
      - name: Refuse a tag that names another version than the generator pins
        id: version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="$(node infra/release/images.mjs --version)"
          if [ "$TAG" != "images-v$version" ]; then
            echo "::error::$TAG does not name the pinned version: packages/cli/src/release-images.json says $version, so the tag must be images-v$version"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          node infra/release/images.mjs --references
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: arm64
      # buildx and BuildKit are pinned: the provenance format and the imagetools templates the
      # release relies on are theirs.
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          version: v0.38.1
          driver-opts: image=moby/buildkit:v0.34.1@sha256:99368f3e46177c6405b9740e4461d91cee004128daeecca78d4ceac50ec1da5c
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.4
      - uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          syft-version: v1.55.0
      - uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
        with:
          version: v0.76.1
      - name: Log in to GHCR with this run's token
        env:
          GHCR_TOKEN: ${{ github.token }}
        run: printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
      - name: Wait for the freed disk
        uses: ./.github/actions/free-disk
        with:
          wait: 'true'

      - name: Build, scan, sign, attest and push every image
        env:
          VERSION: ${{ steps.version.outputs.version }}
          IMAGE_SOURCE: ${{ github.server_url }}/${{ github.repository }}
          COSIGN_CERTIFICATE_IDENTITY_REGEXP: ^${{ github.server_url }}/${{ github.repository }}/\.github/workflows/images\.yml@refs/tags/images-v
        run: |
          set -eu
          REGISTRY="$(node infra/release/images.mjs --registry)"
          export REGISTRY
          sh infra/release/build-and-push.sh --tag "$VERSION" --output "$RUNNER_TEMP/release/images.json"
          cat "$RUNNER_TEMP/release/images.json"
      - name: Log out of GHCR
        if: always()
        run: docker logout ghcr.io
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: platform-images-${{ steps.version.outputs.version }}
          path: ${{ runner.temp }}/release/
          if-no-files-found: error

  # A separate job, so that after the Owner makes the packages public, "Re-run failed jobs" repeats
  # only this check and never rebuilds or re-pushes an image.
  verify-public:
    if: github.repository == 'indxjp/agent-workspace'
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: platform-images-${{ needs.publish.outputs.version }}
          path: ${{ runner.temp }}/release
      - name: Every image is pullable anonymously
        run: |
          set -eu
          docker logout ghcr.io >/dev/null 2>&1 || true
          node --input-type=module -e '
            import { readFileSync } from "node:fs";
            const manifest = JSON.parse(readFileSync(process.argv[1], "utf8"));
            for (const [name, reference] of Object.entries(manifest.images)) console.log(name, reference);
          ' "$RUNNER_TEMP/release/images.json" > "$RUNNER_TEMP/references"
          private=''
          while read -r name reference; do
            if reason="$(docker buildx imagetools inspect "$reference" 2>&1 >/dev/null)"; then
              echo "public: $reference"
            else
              private="$private $name"
              package="agent-workspace%2F$name"
              printf '%s\n' "$reason" >&2
              case "$reason" in
                *401*|*403*|*denied*|*unauthorized*|*Unauthorized*|*Forbidden*) ;;
                *) echo "::error title=Registry error::$reference could not be inspected, and the registry did not refuse it (the error is in the log above). Re-run this failed job; no visibility setting needs to change."; continue ;;
              esac
              echo "::error title=GHCR package is not public::$reference cannot be pulled anonymously. Make the package public once: ${GITHUB_SERVER_URL}/orgs/${GITHUB_REPOSITORY_OWNER}/packages/container/$package/settings, Danger Zone, Change visibility, Public. Then re-run this failed job."
            fi
          done < "$RUNNER_TEMP/references"
          if [ -n "$private" ]; then
            echo "Not anonymously inspectable:$private. See docs/release/README.md, Platform images." >&2
            exit 1
          fi
