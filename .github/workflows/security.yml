name: Security analysis

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]
  # Nightly (02:17 JST): an advisory published after a change merged fails here, not on the next
  # pull request (ADR-0053, Amendment 2026-10-24).
  schedule:
    - cron: '17 17 * * *'

permissions:
  contents: read

jobs:
  dependency-review:
    # Private repositories require GitHub Advanced Security for dependency review. Keep the
    # action fail-closed when supported, and opt private repositories in explicitly after GHAS is
    # enabled instead of producing an unavoidable red check.
    if: >-
      github.event_name == 'pull_request' &&
      (github.event.repository.visibility == 'public' || vars.ENABLE_GITHUB_ADVANCED_SECURITY == 'true')
    runs-on: ${{ github.repository_owner == 'INDXDev' && fromJSON('["self-hosted","ms-a2"]') || 'ubuntu-latest' }}
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high

  # A skipped job reports green, so the opposite condition says out loud that the scans did not run
  # (audit F-03). Secrets and dependencies are still scanned in ci.yml's fast-checks (gitleaks and
  # osv-scanner), which need no Advanced Security.
  ghas-skipped-notice:
    if: >-
      github.event.repository.visibility != 'public' &&
      vars.ENABLE_GITHUB_ADVANCED_SECURITY != 'true'
    runs-on: ${{ github.repository_owner == 'INDXDev' && fromJSON('["self-hosted","ms-a2"]') || 'ubuntu-latest' }}
    steps:
      - run: |
          echo "::warning title=CodeQL and dependency review did not run::GitHub Advanced Security is not enabled for this private repository (set the ENABLE_GITHUB_ADVANCED_SECURITY variable to true once it is). Only gitleaks, osv-scanner and pnpm audit cover this change."

  # GitHub's runner for all three jobs: none of them is on ci-success's path (see ci.yml's header
  # for the runner rule).
  dependency-audit:
    runs-on: ${{ github.repository_owner == 'INDXDev' && fromJSON('["self-hosted","ms-a2"]') || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --audit-level high
      - name: Produce dependency inventory
        run: pnpm licenses list --json > dependency-inventory.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: dependency-inventory
          path: dependency-inventory.json
          if-no-files-found: error

  codeql:
    # Code scanning has the same private-repository GHAS requirement as dependency review.
    if: >-
      github.event.repository.visibility == 'public' ||
      vars.ENABLE_GITHUB_ADVANCED_SECURITY == 'true'
    runs-on: ${{ github.repository_owner == 'INDXDev' && fromJSON('["self-hosted","ms-a2"]') || 'ubuntu-latest' }}
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: javascript-typescript
          build-mode: none
      - uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          category: /language:javascript-typescript
