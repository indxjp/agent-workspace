# The alarm of the nightly runs (ADR-0053, Amendment 2026-10-24). The heavy tier of CI (the Docker
# and end-to-end jobs, coverage, the release checks, the unscoped formal and image scan) and the
# OSS export's cold build left the merge queue and run nightly on main, as the security analysis
# does, so a break they find is already merged. A failed nightly opens one issue per workflow, or
# comments on the open one, with the run and the range of commits since the last green
# nightly, which is where the culprit is. A green nightly closes it. A separate workflow so that
# ci.yml, which the release gate also calls, asks for no `issues` permission.
name: Nightly CI alarm

on:
  workflow_run:
    workflows: [CI, OSS export, Security analysis]
    types: [completed]

permissions:
  contents: read

jobs:
  alarm:
    if: github.repository_owner == 'INDXDev' && (github.event.workflow_run.event == 'schedule' && (github.event.workflow_run.conclusion == 'failure' || github.event.workflow_run.conclusion == 'success'))
    runs-on: [self-hosted, ms-a2]
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
      issues: write
    steps:
      - name: Open, update or close the nightly issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          WORKFLOW: ${{ github.event.workflow_run.name }}
          WORKFLOW_ID: ${{ github.event.workflow_run.workflow_id }}
        run: |
          set -euo pipefail
          title="Nightly $WORKFLOW failed"
          issue=$(gh issue list --state open --search "in:title \"$title\"" --json number,title --jq "map(select(.title == \"$title\"))[0].number // empty")
          if [ "$CONCLUSION" = success ]; then
            if [ -n "$issue" ]; then gh issue close "$issue" --comment "The nightly is green again: $RUN_URL"; fi
            exit 0
          fi
          green=$(gh run list --workflow "$WORKFLOW_ID" --event schedule --status success --limit 1 --json headSha --jq '.[0].headSha // empty')
          if [ -n "$green" ]; then
            range="Commits since the last green nightly: https://github.com/$GH_REPO/compare/$green...$HEAD_SHA"
          else
            range="No earlier green nightly; the failing commit is $HEAD_SHA."
          fi
          body="The nightly $WORKFLOW run on main failed: $RUN_URL

          $range

          Fix it, or revert the change that broke it. The release gate runs the same CI jobs on the tagged commit."
          if [ -n "$issue" ]; then
            gh issue comment "$issue" --body "$body"
          else
            gh issue create --title "$title" --body "$body"
          fi
