name: Agent Store daily jobs

# The Agent Store's two daily production jobs (spec, "The GCP deployment"; the runbook's "The daily
# jobs"). Both read the deployment's address from the repository variable STORE_PRODUCTION_URL and
# are skipped while it is empty, so this workflow is inert until a person has deployed production
# and set it. Neither is a required check and no ci-success need.
#
# sample-check (free): GET /api/demo/templates against the catalog (tests/store/daily/); any difference
# fails the run. daily-test (SPENDS on a real model, once per live entry): the P5 harness against
# production's verification workspace, then each verdict PUT to /api/demo/maintenance/{entry}, so a
# failing entry's card says "Under maintenance" until a later run passes. It runs only while the
# repository variable STORE_DAILY_TEST is `enabled`, which a person sets after approving the spend;
# the job's `if` is the guard, and the workflow passes the harness's opt-in (STORE_LIVE_VERIFY) only
# to that job's run step. There is one schedule, so the spending job starts once a day. Its evidence is the `store-daily-evidence`
# artifact; it is never committed.
#
# The operator token is a repository SECRET, STORE_OPERATOR_TOKEN (the same value as the
# deployment's AW_DEMO_OPERATOR_TOKEN), and the verification workspace's builder API key is the
# secret STORE_PRODUCTION_VERIFY_API_KEY. Each reaches only the step that runs the command, never a
# checkout, install or build step.

on:
  schedule:
    - cron: '47 17 * * *'
  workflow_dispatch:

concurrency:
  group: store-daily
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sample-check:
    name: nightly sample check
    if: github.repository_owner == 'INDXDev' && (vars.STORE_PRODUCTION_URL != '')
    runs-on: [self-hosted, ms-a2]
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24

      - name: Install
        timeout-minutes: 8
        run: pnpm install --frozen-lockfile

      - name: Build the contracts and the SDK the check reads
        timeout-minutes: 10
        run: scripts/ci/nx.sh run-many -t build --projects=@indx-workspace/contracts,@indx-workspace/sdk --output-style=static

      - name: Compare the deployment's templates with the catalog
        timeout-minutes: 5
        env:
          STORE_PLATFORM_URL: ${{ vars.STORE_PRODUCTION_URL }}
          STORE_OPERATOR_TOKEN: ${{ secrets.STORE_OPERATOR_TOKEN }}
        run: node tests/store/daily/run.ts sample-check

  daily-test:
    name: daily production test of the live entries
    if: github.repository_owner == 'INDXDev' && (vars.STORE_PRODUCTION_URL != '' && vars.STORE_DAILY_TEST == 'enabled')
    runs-on: [self-hosted, ms-a2]
    timeout-minutes: 60
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24

      - name: Install
        timeout-minutes: 8
        run: pnpm install --frozen-lockfile

      - name: Build the SDK the harness uses
        timeout-minutes: 15
        run: scripts/ci/nx.sh run-many -t build --projects=@indx-workspace/contracts,@indx-workspace/sdk --output-style=static

      - name: Run each live entry's prompt against real Claude in production and send the verdicts
        timeout-minutes: 40
        env:
          STORE_LIVE_VERIFY: spend-approved
          STORE_LIVE_VERIFY_ENVIRONMENT: production
          STORE_LIVE_VERIFY_API_KEY: ${{ secrets.STORE_PRODUCTION_VERIFY_API_KEY }}
          STORE_PLATFORM_URL: ${{ vars.STORE_PRODUCTION_URL }}
          STORE_OPERATOR_TOKEN: ${{ secrets.STORE_OPERATOR_TOKEN }}
        run: node tests/store/daily/run.ts test store-daily-evidence.json

      - name: Keep the evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: store-daily-evidence
          path: store-daily-evidence.json
          if-no-files-found: warn
