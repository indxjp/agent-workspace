name: Model providers live

# The R-03 research note on the Anthropic Messages API (Decisions) keeps the Anthropic provider's
# ModelCapabilities.promptCaching false until a credential-bound replay against the real API shows
# it. This is that replay, and it keeps running so the claim stays true: three requests through the
# gateway's own anthropic provider row (a cache write, a cache read, a streamed cache read), each
# also read by the gateway's usage extractor (tests/providers-live/prompt-caching.live.mjs). About
# 6,000 cached tokens on a Haiku model per run.
#
# It runs weekly and on `workflow_dispatch` only, never on a pull request (like builder-evals.yml): a
# pull request's code must not run with the live key. It is NOT a required check and not in
# ci-success.needs. It needs the repository secret ANTHROPIC_API_KEY, passed only to the step that
# calls the API. The key is never echoed; the uploaded evidence holds usage counts only and is
# scanned for key-shaped text before it is uploaded.
on:
  schedule:
    - cron: '17 5 * * 1'
  workflow_dispatch:

concurrency:
  group: model-providers-live
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  anthropic-prompt-caching:
    name: Anthropic prompt caching against the real API
    # The live key and this runner exist only in INDXDev; the public export and forks never start it.
    if: github.repository_owner == 'INDXDev'
    runs-on: [self-hosted, ms-a2]
    timeout-minutes: 20
    steps:
      - name: Refuse a missing live-model secret
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -z "${ANTHROPIC_API_KEY//[[:space:]]/}" ]; then
            echo "::error title=Missing secret ANTHROPIC_API_KEY::model-providers-live needs the repository secret ANTHROPIC_API_KEY (an Anthropic API key). An Owner must add it under Settings > Secrets and variables > Actions."
            exit 1
          fi

      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24

      - name: Install
        timeout-minutes: 8
        run: pnpm install --frozen-lockfile

      - name: Build the gateway
        timeout-minutes: 8
        run: scripts/ci/nx.sh run-many -t build --projects=@agent-workspace/gateway --output-style=static

      - name: Check prompt caching through the gateway's anthropic provider
        timeout-minutes: 3
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PROVIDER_LIVE_OUT: ${{ runner.temp }}/model-providers-live/prompt-caching.json
        run: |
          set -uo pipefail
          status=0
          node tests/providers-live/prompt-caching.live.mjs > "$RUNNER_TEMP/summary.md" || status=$?
          cat "$RUNNER_TEMP/summary.md"
          cat "$RUNNER_TEMP/summary.md" >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

      - name: Scan the evidence for a leaked key
        id: scan
        if: always()
        run: node tests/docs-claims/scan-secrets.mjs "$RUNNER_TEMP/model-providers-live"

      - name: Keep the evidence
        if: always() && steps.scan.outcome == 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: anthropic-prompt-caching
          path: ${{ runner.temp }}/model-providers-live/
          if-no-files-found: warn
          retention-days: 90
