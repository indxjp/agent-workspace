# The run_skill_script unit tests on Windows (issue #1095). Every other job runs on Linux, where
# the `/`-joined containment check passed by accident; on Windows realpath returns `\` paths and
# the same check refused every script. This job runs only the files that pin that behaviour, so
# it cannot regress unseen. It also runs the `file://` folder store's Windows test (#1835): only NTFS
# mints the stream, trailing-dot and device-name aliases that store refuses. The tests resolve two workspace packages from dist, so the job builds
# just those first.
#
# It also runs the three files whose cases create symlinks (issue #1749): the runner's file
# verification and resource staging, and the runtime's archive streaming. On Windows a symlink
# needs Developer Mode or the SeCreateSymbolicLinkPrivilege, so this proves they run on the
# Windows runner rather than only on Linux.
#
# A separate workflow, not a ci.yml job: ci.yml is held to Linux labels by
# scripts/check-workflows.mjs, and a Windows VM is the only Windows runner this repository uses
# (as in install-live.yml; Blacksmith's while GitHub-hosted billing is blocked, ADR-0053). Not required by ci-success on purpose, like
# ci-nx-cache.yml: it is path-filtered, and a required check that a diff never triggers would
# block that diff. Cost: one Windows VM, a filtered install and eight test files per
# matching pull request (a few minutes); nothing runs for a diff that cannot reach them.
name: CI Windows unit

on:
  # No push trigger: the merge queue tests the pull request, and a Windows minute costs twice a Linux one.
  pull_request:
    branches: [main]
    paths:
      - 'packages/engine/**'
      - 'packages/engine-claude-agent-sdk/**'
      - 'packages/engine-mastra/**'
      - 'packages/engine-openai-agents/**'
      - 'packages/sdk/**'
      - 'tests/engine/**'
      - 'tests/gallery/run-access.test.ts'
      - 'apps/runner/src/verify-files*.ts'
      - 'apps/runner/src/resources*.ts'
      - 'packages/run-protocol/**'
      - 'packages/runtime/**'
      - 'packages/core/src/storage/folder-store.ts'
      - 'packages/core/src/storage/folder-store.windows.test.ts'
      - 'packages/core/src/storage/key-safety.ts'
      - 'vitest.config.ts'
      - 'pnpm-lock.yaml'
      - '.github/workflows/windows-unit.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-unit-${{ github.event.pull_request.number || github.sha }}
  # Only a pull request supersedes its own earlier run. A push to main has its own group (the SHA), so
  # pushes never cancel or replace each other and every main commit gets a CI result (audit F-02).
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  skill-script:
    name: skill-script unit tests · windows
    runs-on: ${{ github.repository_owner == 'INDXDev' && 'blacksmith-4vcpu-windows-2025' || 'windows-latest' }}
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        timeout-minutes: 8
        run: pnpm install --frozen-lockfile

      # The tests import the engine, its Claude adapter, the SDK, the run protocol and the runtime by
      # package name, which resolves to dist. Nx builds each project's dependencies first (`^build`).
      - name: Build the packages the tests import
        timeout-minutes: 10
        run: pnpm nx run-many -t build --projects=@agent-workspace/engine,@agent-workspace/engine-claude-agent-sdk,@indx-workspace/sdk,@agent-workspace/run-protocol,@agent-workspace/runtime --output-style=static

      - name: Run the skill-script and folder-store tests
        timeout-minutes: 10
        shell: bash
        run: pnpm exec vitest run tests/engine/run-skill-script.test.ts tests/engine/skill-script-windows-paths.test.ts tests/gallery/run-access.test.ts packages/engine/src/skill-script.test.ts packages/core/src/storage/folder-store.windows.test.ts

      - name: Run the symlink tests
        timeout-minutes: 10
        shell: bash
        run: pnpm exec vitest run apps/runner/src/verify-files.test.ts apps/runner/src/resources.test.ts packages/runtime/src/transfer.stream.test.ts
