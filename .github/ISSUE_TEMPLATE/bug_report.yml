name: Bug report
description: Something does not work as documented.
labels: ['bug']
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      placeholder: |
        1.
        2.
        3.
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Versions
      description: Output of `aw --version`, or the package versions you use.
    validations:
      required: true
  - type: dropdown
    id: deployment
    attributes:
      label: Deployment
      options:
        - aw dev
        - Docker Compose
        - Kubernetes
        - Cloud
        - Other
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Relevant output. Remove secrets first.
      render: text
  - type: checkboxes
    id: searched
    attributes:
      label: Checks
      options:
        - label: I searched existing issues.
          required: true
