# actionlint knows GitHub's hosted runner labels only. These are the other labels the workflows'
# `runs-on` names: the self-hosted MS-A2 pool, the label `docker` of the runner group heavy-ci, and
# the Blacksmith runners INDXDev jobs use.
# `pnpm workflows:check` (scripts/check-workflows/tree-rules.mjs) fails when a workflow names a label missing here.
self-hosted-runner:
  labels:
    - blacksmith-2vcpu-ubuntu-2404
    - blacksmith-4vcpu-ubuntu-2404
    - blacksmith-4vcpu-windows-2025
    - blacksmith-6vcpu-macos-latest
    - blacksmith-8vcpu-ubuntu-2404
    - docker
    - ms-a2
