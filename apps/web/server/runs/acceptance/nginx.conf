# nginx for the W1-CP-04 acceptance run (the R-13 research note, findings 3 and 4).
#
# Two locations, and the pair is the point.
#
#   /stock/  proxies with nginx's own defaults: `proxy_buffering on`, `proxy_read_timeout 60s`,
#            `gzip on` with the default `gzip_types text/html`. This is an nginx nobody
#            configured for SSE. A ten-minute stream that survives HERE is evidence that the
#            15 s keep-alive of `sse.ts` clears the 60 s idle timeout without any cooperation
#            from the proxy — which is the claim R-13 marked `inferred` and never executed.
#
#   /tuned/  proxies with the block R-13's contract summary prescribes for spec §33's
#            self-hosted Compose deployment. It should be strictly easier than /stock/.
#
# `aw-host` is added to /etc/hosts by `docker run --add-host aw-host:host-gateway`, which yields
# an IPv4 address. R-13 records a false positive caused by `host.docker.internal` resolving to an
# unreachable IPv6 address; naming an explicitly-IPv4 host avoids repeating it.

events {}

http {
  default_type application/octet-stream;
  access_log /dev/stdout;
  error_log  /dev/stderr info;

  # ON, with the DEFAULT gzip_types. R-13 finding 3: the failure that actually kills SSE is the
  # gzip filter with `text/event-stream` in `gzip_types`, and the load-bearing control is that it
  # is not there by default. Leaving gzip on is what makes this a real test rather than a
  # sympathetic one.
  gzip on;

  server {
    listen 8099;
    server_name _;

    # Everything at nginx's defaults. Do not add a proxy_buffering or proxy_read_timeout here.
    location /stock/ {
      proxy_pass         http://aw-host:3111/;
      proxy_http_version 1.1;
      proxy_set_header   Connection '';
      proxy_set_header   Host $host;
    }

    # R-13's contract summary, verbatim in intent.
    location /tuned/ {
      proxy_pass         http://aw-host:3111/;
      proxy_http_version 1.1;
      proxy_set_header   Connection '';
      proxy_set_header   Host $host;
      proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header   X-Forwarded-Proto $scheme;

      proxy_buffering    off;
      proxy_cache        off;
      proxy_read_timeout 3600s;
      proxy_send_timeout 3600s;
      chunked_transfer_encoding on;
      gzip               off;
    }
  }
}
