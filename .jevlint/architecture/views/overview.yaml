  - { from: routes, to: compose, verb: boots once }
  - { from: routes, to: identity, verb: authenticates }
  - { from: routes, to: runs, verb: starts runs }
  - { from: routes, to: agents, verb: edits agents }
  - { from: routes, to: storage, verb: serves files }
