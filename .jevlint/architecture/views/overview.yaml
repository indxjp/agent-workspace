title: How a run travels through Agent Workspace
description: Every caller enters through the routes; the execution domain hands the run to the runner over HTTP, and the runner alone picks the driver and the engine.
groups:
  - { id: clients, label: Published clients }
  - { id: control, label: Control plane (apps/web) }
  - { id: exec, label: Execution plane }
  - { id: base, label: Contracts and persistence }
nodes:
  - { id: member, label: Workspace member, kind: actor }
  - { id: developer, label: Developer or CI, kind: actor }
  - { id: aw, label: aw command line, kind: component, component: aw-cli, group: clients }
  - { id: sdk, label: TypeScript SDK, kind: component, component: sdk, group: clients }
  - { id: chat, label: Hosted chat, kind: component, component: react-chat, group: clients }
  - { id: screens, label: Browser screens, kind: component, component: web-ui, group: control }
  - { id: routes, label: Routes and pages, kind: component, component: web-routes, group: control }
  - { id: compose, label: Composition root, kind: component, component: composition, group: control }
  - { id: identity, label: Identity and RBAC, kind: component, component: identity, group: control }
  - { id: runs, label: Runs and sessions, kind: component, component: execution, group: control }
  - { id: storage, label: Storage catalog, kind: component, component: storage-sharing, group: control }
  - { id: agents, label: Agents and Builder, kind: component, component: agent-authoring, group: control }
  - { id: integrations, label: Connectors and triggers, kind: component, component: integrations, group: control }
  - { id: runner, label: Runner, kind: component, component: runner, group: exec }
  - { id: drivers, label: Runtime drivers, kind: component, component: runtime-drivers, group: exec }
  - { id: engines, label: Engine adapters, kind: component, component: engine-adapters, group: exec }
  - { id: gateway, label: Model gateway, kind: component, component: gateway, group: exec }
  - { id: contracts, label: API contracts, kind: component, component: contracts, group: base }
  - { id: run-protocol, label: Engine port and RunRequest, kind: component, component: run-contract, group: base }
  - { id: core, label: Persistence and storage, kind: component, component: persistence, group: base }
  - { id: postgres, label: PostgreSQL, kind: store, path: packages/core/src/db }
  - { id: objects, label: Object storage, kind: store, path: packages/core/src/storage }
  - { id: engine-sdks, label: Engine SDKs, kind: external, packages: ["@anthropic-ai/claude-agent-sdk", "@openai/agents", "@mastra/core", "@earendil-works/pi-coding-agent"] }
  - { id: sandboxes, label: Sandbox platforms, kind: external, packages: ["@kubernetes/client-node"] }
