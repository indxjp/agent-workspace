  - { from: member, to: screens, verb: uses the console }
  - { from: developer, to: aw, verb: runs commands }
  - { from: aw, to: sdk, verb: calls the API }
  - { from: screens, to: sdk, verb: calls the API }
  - { from: screens, to: chat, verb: renders chat }
  - { from: sdk, to: contracts, verb: validates responses }
  - { from: sdk, to: routes, verb: "HTTPS /api/**", style: dashed }
