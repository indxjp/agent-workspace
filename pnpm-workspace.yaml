packages:
  - apps/*
  - packages/*

# `@agent-workspace/contracts` declares zod as a peer (one instance for a published consumer) and
# pins it only as a devDependency. A workspace package is linked, not injected, so its peer is
# never linked into its own node_modules, and the `--prod` install every runtime Dockerfile runs
# drops the devDependency: `contracts/dist` then fails with ERR_MODULE_NOT_FOUND for zod.
# Hoisting zod to the root node_modules gives it the one copy every importer already pins.
publicHoistPattern:
  - zod

# Dependency install scripts, decided explicitly rather than left for pnpm to prompt about.
# pnpm 11 and later treat an unanswered install script as an error (ERR_PNPM_IGNORED_BUILDS,
# exit 1), so `pnpm install --frozen-lockfile` — CI's first step — fails until every package that
# ships one has an answer here. The `pnpm` field in package.json is no longer read (pnpm 11
# warns and ignores it), so this file is the only place the answer can live.
#
# esbuild: false — DENIED, and the deny is the tested configuration, not a guess. esbuild
# arrives only as drizzle-kit's bundler, drizzle-kit is a devDependency that never enters a
# runtime image (R-15 §3), and its install script is not needed: `pnpm db:generate` produces
# the migration correctly with the script denied. Denying it keeps a build-time-only package
# from executing arbitrary code at install. Reasoning and the reversal path:
# docs/adr/W1-DB-01-schema-conventions.md.
allowBuilds:
  # embedded-postgres ships PostgreSQL as files in the package; these scripts restore symlinks
  # represented by metadata files after npm unpacks each platform archive.
  '@embedded-postgres/darwin-arm64': true
  '@embedded-postgres/darwin-x64': true
  '@embedded-postgres/linux-arm': true
  '@embedded-postgres/linux-arm64': true
  '@embedded-postgres/linux-ia32': true
  '@embedded-postgres/linux-ppc64': true
  '@embedded-postgres/linux-x64': true
  '@embedded-postgres/windows-x64': true
  esbuild: false
  # Transitive dependency of @earendil-works/pi-coding-agent (pi-ai's Google provider, which the pi
  # adapter never selects: it reaches its model only through the gateway). Its only install script
  # is `preinstall: echo 'preinstall: no-op'`, so denying it loses nothing.
  '@google/genai': false
  # nx's postinstall only pre-computes the project graph as a warm-up for the daemon; the graph is
  # rebuilt on first use anyway, so nothing is lost by denying it, and denying keeps another
  # build-time-only tool from executing code at install (same reasoning as esbuild above).
  nx: false
  # Transitive dependency of @kubernetes/client-node. Its postinstall only prints the
  # upstream donation message; generated runtime code is already present in the package.
  protobufjs: false

# Version overrides, decided explicitly for the same reason the build-script answers above are.
#
# undici 7: 7.30.0 is inside GHSA-4qv8-2p9j-2685, GHSA-f72v-6w45-q472 and GHSA-xjj6-f33q-929c
# (high, patched in >=7.30.1), which fail `pnpm audit --audit-level high`. Two dependents still allow
# it: nx@24.0.1 (build-time only) pins 7.29.0 exactly, and `@ai-sdk/provider-utils` (5.0.54, 5.0.58)
# declares ^7.29.0 and is in the runtime tree through `@mastra/core` and `@ai-sdk/anthropic`/`openai`.
# So the override applies to runtime images too, and is generated into new projects (below). The
# selector keeps the major. Remove it, and its `RUNTIME_OVERRIDES` entry in the same change, once
# `pnpm why undici` shows nx and every `@ai-sdk/provider-utils` resolving >=7.30.1 without it.
#
# undici 8: the same three advisories are patched in >=8.12.2; `@earendil-works/pi-ai` 1.1.0 (the
# Pi engine, runtime tree) resolves 8.10.2. Remove it once `pnpm why undici` shows >=8.12.2 without it.
#
# body-parser: 2.3.0 is inside GHSA-27r3-jxmh-p828 (high, patched in >=2.4.0); express@5.2.1 under
# `@modelcontextprotocol/sdk` (runtime tree) locks it. Remove it once express resolves >=2.4.0.
#
# @azure/msal-node: 6.x is inside GHSA-xcx6-jx8p-x3h5 (high, patched only in >=7.1.0) and
# `@azure/identity` 4.14.0, the latest, still declares ^6.0.0. Identity only uses the
# ConfidentialClientApplication/PublicClientApplication API that 7.x keeps. Remove it once
# `@azure/identity` declares ^7.1.0.
#
# @esbuild-kit/core-utils>esbuild: drizzle-kit@0.31.11 (latest stable) still depends on the
# deprecated @esbuild-kit/esm-loader, whose core-utils pins esbuild ~0.18.20, inside
# GHSA-67mh-4wv8-2f99 (fixed in >=0.25.0). drizzle-kit itself uses esbuild ^0.25.4, so the override
# moves the loader onto the same esbuild. Dev-only (drizzle-kit is a devDependency); remove it once
# drizzle-kit drops @esbuild-kit/esm-loader.
#
# @modelcontextprotocol/{server,client,core}: @mastra/mcp (2.3.0 through 2.5.0, the latest) pins
# server, client and core 2.2.0 exactly; server 2.2.0 is inside CVE-2026-111768 and CVE-2026-111770
# (high, fixed in 2.3.0), which fail the release trivy gate on the runner image. The three are
# released together and server/client depend on core at the same exact version, so all three move.
# Remove these once `pnpm why @modelcontextprotocol/server` shows >=2.3.0 without them.
#
# @modelcontextprotocol/node: @mastra/mcp (through 2.5.0, the latest) also pins node 2.0.0 exactly,
# inside GHSA-f897-62hf-6gxq (high: HTTP transports did not limit request body size or JSON-RPC
# batch length; patched in >=2.1.0). Exact 2.1.1, not a range: it is the newest release whose
# `@modelcontextprotocol/server` peer (^2.3.0) the server override above satisfies (2.1.2 wants
# ^2.4.0). Remove it once `pnpm why @modelcontextprotocol/node` shows >=2.1.0 without it.
#
# @hono/node-server: 1.19.10 through 2.1.2 are inside GHSA-rmxm-3fg6-px4f (moderate: serveStatic
# decodes the path twice; fixed only in >=2.1.3, with no 1.x fix), which osv-scanner reports.
# `@modelcontextprotocol/node` 2.1.1 (pinned above) declares ^1.19.9, while its next release 2.1.2
# declares `^1.19.9 || ^2.1.3`, so 2.x is the upstream-supported line for it. Remove this once
# `pnpm why @hono/node-server` shows >=2.1.3 without it.
#
# Every override here that reaches the runtime tree is also generated into a new project, since
# only the installing project's root can override (`RUNTIME_OVERRIDES` in
# packages/sdk/src/project/render.ts; install-scripts.test.ts fails when one is missing).
overrides:
  'undici@>=7.0.0 <7.30.1': '^7.30.1'
  'undici@>=8.0.0 <8.12.2': '^8.12.2'
  'body-parser@>=2.0.0 <2.4.0': '^2.4.0'
  '@azure/msal-node@>=5.0.0-beta.0 <7.1.0': '^7.1.0'
  '@esbuild-kit/core-utils>esbuild': '0.25.12'
  '@modelcontextprotocol/server@>=2.0.0 <2.3.0': '^2.3.0'
  '@modelcontextprotocol/client@>=2.0.0 <2.3.0': '^2.3.0'
  '@modelcontextprotocol/core@>=2.0.0 <2.3.0': '^2.3.0'
  '@modelcontextprotocol/node@>=2.0.0 <2.1.0': '2.1.1'
  '@hono/node-server@>=1.19.10 <2.1.3': '^2.1.3'

minimumReleaseAgeExclude:
  - '@ai-sdk/anthropic@4.0.88'
  - '@ai-sdk/provider-utils@5.0.68'
  - '@ai-sdk/provider@4.0.34'
