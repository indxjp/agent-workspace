apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: deny-all-egress }
spec:
  podSelector: {}
  policyTypes: [Egress]
  egress: []
---
apiVersion: v1
kind: Pod
metadata: { name: deny-probe }
spec:
  restartPolicy: Never
  containers:
    - name: probe
      image: busybox:1.36
      command: ["sh", "-c", "sleep 600"]
      securityContext: { allowPrivilegeEscalation: false, runAsNonRoot: true, runAsUser: 1000, capabilities: { drop: ["ALL"] }, seccompProfile: { type: RuntimeDefault } }
