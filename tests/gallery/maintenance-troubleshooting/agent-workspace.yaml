apiVersion: agentworkspace.dev/v2
kind: Project
name: maintenance-troubleshooting
engine: claude-agent-sdk
# The past troubles, the experts' notes and the manuals are granted folders searched with the
# built-in `search_files`; upload them once, keeping their folders:
#   (cd data && for f in $(find trouble-log expert-notes manuals -type f); do aw files upload "$f" "$f"; done)
# Logging a resolved case is the maintenance system's `POST /resolutions`, an openapiTool() in
# tools/maintenance.ts: `aw dev` reads apis/maintenance.openapi.json and takes MAINTENANCE_TOKEN from
# its environment, and the caller assertion is signed with the workspace secret
# MAINTENANCE_IDENTITY_SECRET (`aw secrets set`):
#   MAINTENANCE_TOKEN=... aw dev
# The document's `servers` is the plant's system; to try the project, run the bundled stand-in and
# set servers[0].url to http://127.0.0.1:8793/api/v1:
#   MAINTENANCE_TOKEN=... IDENTITY_SECRET=... IDENTITY_AUDIENCE=<tool-id> IDENTITY_WORKSPACE=<workspace-id> #     TROUBLE_LOG_STORE=./trouble-log.store.json PORT=8793 node maintenance/fake-maintenance.mjs
policy:
  permissions:
    readFiles: true
    writeFiles: false
    runCommands: false
    unrestrictedNetwork: false
  # The only openapiTool any agent in this project may use.
  tools: [maintenance]
  limits:
    maxBudgetUsd: 0.5
  promotion:
    minEvalScore: 0.9
environments:
  local:
    cloud: local
    identity:
      bootstrapAdmin: admin@localhost.test
