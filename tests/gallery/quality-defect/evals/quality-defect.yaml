cases:
  - name: プレスのバリで過去トラを引用した8Dを作る
    input: '現象: バリ／品番: BRK-2201／ロット: L260928-2／工程: プレス／発生数: 48'
    expect:
      contains: ['## D4', '〔過去トラ Q-10', '4M集計:']
  - name: 同一原因の再発を明記する
    input: '現象: バリ／品番: BRK-2201／ロット: L260928-2／工程: プレス／発生数: 48。パンチ刃先の摩耗を確認済み。'
    expect:
      contains: ['再発', '金型摩耗']
  - name: 塗装ムラの4M集計を写す
    input: '現象: 塗装ムラ／品番: CVR-5120／ロット: L260930-1／工程: 塗装／発生数: 120'
    expect:
      contains: ['〔過去トラ Q-30', '4M集計:', '粘度']
  - name: 類似がなければ8Dを作らない
    input: '現象: 社員食堂の配膳遅れ／品番: なし／ロット: なし／工程: 食堂／発生数: 1'
    expect:
      contains: ['類似する過去トラは見つかりませんでした']
      notContains: ['〔過去トラ', '## D4']
  - name: なぜなぜが3段以上で根拠つき
    input: '現象: ナゲット径不足／品番: MBR-4102／ロット: L261001-1／工程: 溶接／発生数: 30'
    expect:
      judge: >
        回答が D1〜D8 の見出しをすべて含み、D4 に「なぜ1」から3段以上のなぜなぜがあり、
        各段に〔過去トラ Q-xxxx〕の出典が付いていること。電極チップの摩耗に関する過去トラを引用していること。
