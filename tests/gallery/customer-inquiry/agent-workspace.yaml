apiVersion: agentworkspace.dev/v2
kind: Project
name: customer-inquiry
engine: claude-agent-sdk
# The CRM history server is your own MCP server (mcp/crm-history.mjs). A project file names only
# remote connectors, so run it over Streamable HTTP for `aw dev`, with the same secret the chat
# backend signs customer tokens with:
#   CRM_TOKEN_SECRET=... MCP_TRANSPORT=http PORT=8788 node mcp/crm-history.mjs
connectors:
  crm-history:
    url: http://127.0.0.1:8788/mcp
    transport: http
policy:
  permissions:
    readFiles: false
    writeFiles: false
    runCommands: false
    unrestrictedNetwork: false
  limits:
    maxBudgetUsd: 0.5
  promotion:
    minEvalScore: 0.9
environments:
  local:
    cloud: local
    identity:
      bootstrapAdmin: admin@localhost.test
