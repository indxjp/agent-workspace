apiVersion: agentworkspace.dev/v2
kind: Project
name: customer-inquiry
engine: claude-agent-sdk
# No MCP connector: the CRM history is an openapiTool() in tools/crm.ts. `aw dev` reads
# apis/crm.openapi.json and registers it, taking CRM_TOKEN from its environment. The caller
# assertion the tool opts in with (`identity`, ADR-0142) is signed with the workspace secret
# CRM_IDENTITY_SECRET; give the CRM the same value so it can verify whose records are asked for:
#   add CRM_IDENTITY_SECRET under Secrets in the console, signed in as the Owner, once aw dev is ready
#   CRM_TOKEN=... aw dev
# The document's `servers` is the company's CRM (crm.example.co.jp), which is not reachable from
# here. To try the project, run the bundled stand-in with the same token and set
# servers[0].url in apis/crm.openapi.json to http://127.0.0.1:8794/api/v1:
#   CRM_TOKEN=... CRM_IDENTITY_SECRET=... IDENTITY_AUDIENCE=<tool-id> IDENTITY_WORKSPACE=<workspace-id> \
#     PORT=8794 node crm/fake-crm.mjs
# The FAQ is searched with the built-in `search_files` over `data/faq` (upload it with
# `aw files upload`).
policy:
  permissions:
    # search_files reads the granted FAQ folder only.
    readFiles: true
    writeFiles: false
    runCommands: false
    unrestrictedNetwork: false
  # The only connector any agent in this project may use.
  tools: [crm]
  limits:
    maxBudgetUsd: 0.5
  promotion:
    minEvalScore: 0.9
environments:
  local:
    cloud: local
    identity:
      bootstrapAdmin: admin@localhost.test
