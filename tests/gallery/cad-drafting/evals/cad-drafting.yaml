cases:
  - name: 似た過去図面を差分つきで3件示す
    input: ブラケット 140×90、SUS304 t2.0、φ9 の取付穴4か所（左下から 15,15 / 125,15 / 15,75 / 125,75）、新図番 BRK-1101。似た図面を探して。
    expect:
      contains: ['BRK-1003', '高さ 80 → 90']
  - name: 選んだ図面から作図し未検図と明記する
    input: >
      ブラケット 140×90、SUS304 t2.0、φ9 の取付穴4か所（左下から 15,15 / 125,15 / 15,75 / 125,75）、
      新図番 BRK-1101。BRK-1003 を元に作図して。
    expect:
      contains: ['BRK-1101', '未検図']
      judge: >
        回答が BRK-1003 を元に高さを 80 から 90 に変え、穴位置を要件どおりにした変更セットを
        json のコードブロックで示し、要件にない寸法を変えていないこと。
  - name: 寸法が足りなければ推測せず確認する
    input: ブラケットを新しく作図して。材質は SS400。
    expect:
      notContains: ['"drawingNo"']
      judge: >
        回答が外形の幅・高さや取付穴などの不足している寸法を推測で補わず、設計者に確認していること。
  - name: 矩形でない図面は伸縮で流用しない
    input: L形ブラケット BRK-1004 を元に、幅 120 に広げた図面を作って。新図番 BRK-1102。
    expect:
      notContains: ['"drawingNo": "BRK-1102"']
      judge: >
        回答が BRK-1004 の外形は矩形でないため伸縮での流用作図はできないと説明し、
        手での作図か別の候補を勧めていること。
