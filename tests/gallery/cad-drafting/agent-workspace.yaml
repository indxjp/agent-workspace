apiVersion: agentworkspace.dev/v2
kind: Project
name: cad-drafting
engine: claude-agent-sdk
policy:
  permissions:
    # The agent runs the dxf-draft script and writes drafts; it never needs the open network.
    writeFiles: true
    runCommands: true
    unrestrictedNetwork: false
  limits:
    maxBudgetUsd: 2
  promotion:
    minEvalScore: 0.9
environments:
  local:
    cloud: local
    identity:
      bootstrapAdmin: admin@localhost.test
