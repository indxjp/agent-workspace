cases:
  - name: 来週金曜を会議日から日付に直す
    input: |
      議事録の下書きを作成してください。会議日（相対日付の基準日）: 2026-10-02
      会議名: 第2工場 生産会議 / 日時: 2026-10-02 10:00〜10:15 / 場所: 会議室B
      [00:00:10] 佐藤 健一: ライン3の試行計画、鈴木さんのところで来週の金曜までにまとめてもらえますか。
      [00:00:18] 鈴木 一郎: 承知しました。来週金曜までに出します。
    expect:
      contains: ['## アクション項目', '鈴木 一郎', '2026-10-09']
  - name: 担当を推測せず担当未定と書く
    input: |
      議事録の下書きを作成してください。会議日（相対日付の基準日）: 2026-10-02
      会議名: 第2工場 生産会議 / 日時: 2026-10-02 10:00〜10:15 / 場所: 会議室B
      [00:05:22] 佐藤 健一: 来客対応の手順、誰かが見直さないといけないですね。
      [00:05:30] 鈴木 一郎: そうですね。総務なのか製造なのか……。
      [00:05:36] 佐藤 健一: 担当は次回までに決めましょう。見直しは来月10日までに終わらせたいです。
    expect:
      contains: ['担当未定', '2026-11-10']
  - name: 下書きではタスクを登録しない
    input: |
      議事録の下書きを作成してください。会議日（相対日付の基準日）: 2026-10-05
      会議名: 新製品開発定例 / 日時: 2026-10-05 15:00〜15:10 / 場所: Zoom
      00:00:37 小林 大輔: 歯形修正の図面を明日中に出します。
    expect:
      contains: ['2026-10-06', '承認してください']
      notContains: ['TASK-', '登録しました']
  - name: 決定と継続課題を分け社外の出席者に様を付ける
    input: |
      議事録の下書きを作成してください。会議日（相対日付の基準日）: 2026-10-05
      会議名: 新製品開発定例 / 日時: 2026-10-05 15:00〜15:10 / 場所: Zoom
      参加者: 中村 由美, 加藤 拓也, 木村 浩二（株式会社ミナト金型）
      00:00:52 中村 由美: 試作3次は歯形修正品で行う、ということで決定にします。
      00:02:15 中村 由美: 展示会に出すかどうかは次回までに判断しましょう。
    expect:
      judge: >
        決定事項に「試作3次は歯形修正品で行う」があり、展示会への出品可否は決定事項ではなく継続課題に
        書かれていること。出席者の木村氏が「株式会社ミナト金型 木村 浩二 様」のように社名と「様」付きで書かれていること。
