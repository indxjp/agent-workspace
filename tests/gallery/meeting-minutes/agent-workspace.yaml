apiVersion: agentworkspace.dev/v2
kind: Project
name: meeting-minutes
engine: claude-agent-sdk
# The tracker's reads (members and tasks) are your own MCP server (mcp/tasks.mjs). A project file
# names only remote connectors, so run it over Streamable HTTP for `aw dev`. `identity` opts the
# connector in to the signed caller assertion, so the tracker shows only the departments the person
# who ran the meeting covers (create the secret with `aw secrets set TASK_TRACKER_IDENTITY_SECRET`):
#   IDENTITY_SECRET=... IDENTITY_AUDIENCE=<connector-id> IDENTITY_WORKSPACE=<workspace-id> \
#     MCP_TRANSPORT=http PORT=8788 TASKS_FILE=./tasks.json node mcp/tasks.mjs
# Creating a task is the tracker's `POST /tasks`, an openapiTool() in tools/tracker.ts: `aw dev`
# reads apis/tracker.openapi.json and takes TRACKER_TOKEN from its environment, and the caller
# assertion is signed with the workspace secret TRACKER_IDENTITY_SECRET (`aw secrets set`):
#   TRACKER_TOKEN=... aw dev
# The document's `servers` is the company's tracker; to try the project, run the bundled stand-in on
# the same TASKS_FILE and set servers[0].url to http://127.0.0.1:8789/api/v1:
#   TRACKER_TOKEN=... IDENTITY_SECRET=... IDENTITY_AUDIENCE=<tool-id> IDENTITY_WORKSPACE=<workspace-id> \
#     TASKS_FILE=./tasks.json PORT=8789 node tracker/fake-tracker.mjs
connectors:
  task-tracker:
    url: http://127.0.0.1:8788/mcp
    transport: http
    identity:
      secret: TASK_TRACKER_IDENTITY_SECRET
policy:
  permissions:
    writeFiles: false
    runCommands: true
    unrestrictedNetwork: false
  # The only openapiTool any agent in this project may use.
  tools: [tracker]
  limits:
    maxBudgetUsd: 1
  promotion:
    minEvalScore: 0.9
environments:
  local:
    cloud: local
    identity:
      bootstrapAdmin: admin@localhost.test
