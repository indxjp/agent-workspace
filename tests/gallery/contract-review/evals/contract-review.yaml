cases:
  - name: 上限のない損害賠償を高リスクで指摘する
    input: contracts/営業一部/業務委託契約書_株式会社ミナトシステムズ案.docx をレビューしてください。
    expect:
      contains: ['| 第6条 |', '〔PB-01〕']
      judge: >
        リスク表に第6条（損害賠償）の行があり、リスク度が「高」で、賠償額に上限がないこと（逸失利益・
        弁護士費用まで含むこと）を理由に挙げ、修正文案に賠償額の上限が書かれていること。
  - name: 反社条項の欠落を指摘する
    input: contracts/営業一部/業務委託契約書_株式会社ミナトシステムズ案.docx をレビューしてください。
    expect:
      contains: ['〔PB-06〕', '欠落']
      judge: >
        リスク表に、反社会的勢力の排除条項が契約書にないことを指摘する行があり、リスク度が「高」で、
        修正文案として新設する排除条項（表明保証と無催告解除）が書かれていること。
  - name: 一方的な解除権とバックグラウンドIPの譲渡を指摘する
    input: contracts/営業一部/業務委託契約書_株式会社ミナトシステムズ案.docx をレビューしてください。
    expect:
      contains: ['〔PB-03〕', '〔PB-04〕', '〔PB-05〕']
      judge: >
        リスク表が、第7条で甲だけが理由を問わず解除できること、第5条で乙が従前から保有する知的財産権まで
        甲に譲渡されること、第8条で通知による更新拒絶の定めがないまま自動更新されることを、それぞれ
        別の行で指摘し、各行に双方対等にする・バックグラウンドIPを除外する・3か月前通知を加える
        修正文案があること。
  - name: 日本法以外の準拠法を指摘する
    input: contracts/営業一部/秘密保持契約書_Harborline Japan案.docx をレビューしてください。
    expect:
      contains: ['| 第8条 |', '〔PB-02〕']
      judge: >
        リスク表に第8条の行があり、準拠法がニューヨーク州法で管轄が米国の裁判所であることを
        リスク度「高」で指摘し、修正文案が日本法と東京地方裁判所の専属的合意管轄を定めていること。
  - name: 標準どおりの条項を指摘しない
    input: contracts/購買部/売買基本契約書_北陸精工株式会社案.docx をレビューしてください。
    expect:
      contains: ['〔PB-08〕', '〔PB-09〕']
      notContains: ['〔PB-01〕', '〔PB-05〕', '〔PB-06〕']
      judge: >
        リスク表が第4条（90日払い）と第5条（承諾なしの再委託）を指摘し、標準条項どおりの第7条（損害賠償）、
        第9条（反社会的勢力の排除）、第10条（有効期間）を問題として挙げていないこと。
  - name: 締結の可否を断定しない
    input: contracts/営業一部/秘密保持契約書_Harborline Japan案.docx をレビューして、このまま締結してよいか教えて。
    expect:
      notContains: ['締結して問題ありません', '締結して差し支えありません']
      judge: >
        回答がリスク表を示したうえで、締結の可否は法務担当者の判断であると述べ、自ら締結してよいと
        断定していないこと。
