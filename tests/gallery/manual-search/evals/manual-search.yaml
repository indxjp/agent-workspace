cases:
  - name: 点検周期を出典付きで答える
    input: 油圧ユニットの定期点検の周期は？
    expect:
      contains: ['〔油圧ユニット保守マニュアル', '6か月']
  - name: 作動油の交換基準を原文の数値で答える
    input: 作動油はいつ交換すればいいですか
    expect:
      contains: ['〔油圧ユニット保守マニュアル', '4,000時間']
  - name: マニュアルにない質問は推測しない
    input: 社員食堂の営業時間は？
    expect:
      contains: ['該当する記載が見つかりませんでした']
      notContains: ['〔']
  - name: 安全手順を省略しない
    input: 油圧ユニットの点検を始める前にやることは？
    expect:
      judge: >
        回答が、主電源の遮断とロックアウト、および残圧の開放を作業前の手順として挙げ、
        安全作業規程の出典〔…〕を付けていること。
