apiVersion: agentworkspace.dev/v2
kind: Project
name: manual-search
engine: claude-agent-sdk
policy:
  permissions:
    writeFiles: false
    runCommands: true # run_skill_script, for the office-reader skill that reads the PDFs
    unrestrictedNetwork: false
  limits:
    maxBudgetUsd: 1
  promotion:
    minEvalScore: 0.9
environments:
  local:
    cloud: local
    identity:
      bootstrapAdmin: admin@localhost.test
