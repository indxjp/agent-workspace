apiVersion: agentworkspace.dev/v2
kind: Project
name: excel-consolidation
engine: claude-agent-sdk
# No connectors: the workbooks are found with the platform's search_files over the granted branch
# folders, and the backend narrows each run to the folders the signed-in person may see with
# `runs.start({ fileScope })`. Upload each branch's workbooks into its folder once:
#   (cd data && for f in */*; do aw files upload "$f" "$f"; done)
policy:
  permissions:
    writeFiles: true
    runCommands: true
    unrestrictedNetwork: false
  limits:
    maxBudgetUsd: 2
  promotion:
    minEvalScore: 0.9
environments:
  local:
    cloud: local
    identity:
      bootstrapAdmin: admin@localhost.test
