cases:
  - name: 設備投資の決裁区分を別表から判定する
    input: >
      稟議ID R-2026-0101 rev.1 / 件名: 第3工場 搬送コンベヤの更新 / 区分: 設備投資 /
      金額（税抜）: 45,000,000円 / 起案部門: 製造本部 第3製造部 / 起案者: 山本 健 /
      目的: 老朽化したコンベヤの更新 / 期待効果: （未記載） / 支払条件: 検収後翌月末 /
      実施予定日: 2026-12-01 / 見積社数: 1 / 特命理由: （未記載） / 予算: 予算内
    expect:
      contains: ['## 決裁区分', '取締役会決裁', '〔職務権限規程 §3.1〕']
  - name: 記載漏れと相見積の不足を条文つきで指摘する
    input: >
      稟議ID R-2026-0101 rev.1 / 件名: 第3工場 搬送コンベヤの更新 / 区分: 設備投資 /
      金額（税抜）: 45,000,000円 / 起案部門: 製造本部 第3製造部 / 起案者: 山本 健 /
      目的: 老朽化したコンベヤの更新 / 期待効果: （未記載） / 支払条件: 検収後翌月末 /
      実施予定日: 2026-12-01 / 見積社数: 1 / 特命理由: （未記載） / 予算: 予算内
    expect:
      contains: ['## 記載漏れ', '期待効果', '〔稟議規程 §4.1〕', '〔稟議規程 §4.2〕']
  - name: 政治家の後援会への寄付は否決の先例を示す
    input: >
      稟議ID R-2026-0115 rev.1 / 件名: 県議会議員後援会への協賛金 / 区分: 寄付 /
      金額（税抜）: 100,000円 / 起案部門: 営業本部 法人営業部 / 起案者: 佐藤 美咲 /
      目的: 地域との関係強化 / 期待効果: 地域での認知向上 / 支払条件: 一括 /
      実施予定日: 2026-11-10 / 予算: 予算内
    expect:
      contains: ['〔寄付金取扱基準 §2.2〕', 'R-2025-0170']
  - name: 承認や否決を推奨しない
    input: >
      稟議ID R-2026-0120 rev.2 / 件名: 本社ビル清掃業務の委託（2027年度） / 区分: 業務委託 /
      金額（税抜）: 3,600,000円 / 起案部門: 総務部 / 起案者: 田中 誠 / 目的: 本社ビルの清掃 /
      期待効果: 衛生環境の維持 / 支払条件: 月払い / 実施予定日: 2027-04-01 /
      前年度契約: 3,600,000円（同額） / 予算: 予算内
    expect:
      contains: ['部長決裁', '〔職務権限規程 §3.2〕']
      notContains: ['承認を推奨', '否決を推奨', '承認してよい']
      judge: >
        レビューシートが「記載漏れ」「規程との照合」「決裁区分」「類似案件」「総合所見」の
        5つの見出しをこの順ですべて含み、承認・否決の判断や推奨を書いていないこと。
        承認・否決・差戻しを勧める表現や、可否の結論（「承認すべき」「否決が妥当」「差し戻すべき」など）が
        あれば不合格とする。一方、決裁者が確認すべき点を挙げること（「確認が必要」「確認が求められる」
        など）や、規程への「抵触のおそれ」を示すことは、総合所見に必要な内容であり、推奨や判断には当たらない。
