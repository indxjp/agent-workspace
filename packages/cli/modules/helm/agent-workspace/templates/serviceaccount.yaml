apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.serviceAccount.name | quote }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: true
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: agent-workspace-runner-manager
automountServiceAccountToken: true
---
# The identity of a sandbox Pod. It holds no Role and mounts no token: the runner manager creates the
# Pods (RUNTIME_DRIVER=kubernetes) in this namespace under it.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: agent-runtime
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: agent-workspace-runner-manager
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch", "create", "delete"]
  # One ClusterIP Service per sandbox, so the runner manager reaches it by name; `get` reads the
  # gateway Service's address for the sandbox's hosts file.
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["get", "create", "delete"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["networkpolicies"]
    verbs: ["get", "list", "watch", "create", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: agent-workspace-runner-manager
subjects:
  - kind: ServiceAccount
    name: agent-workspace-runner-manager
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: agent-workspace-runner-manager
