apiVersion: agentworkspace.dev/v2
kind: Project
name: price-guard
engine: claude-agent-sdk
# Review to a standard (archetype RV): the document under review is in `price-guard/inbox`, the
# standard in `price-guard/standards`, and the report goes to `price-guard-reports` only once a person
# approves the `Write`. Every folder is the entry's own, so two entries never share one:
#   for f in $(cd data/ja && find . -type f); do aw files upload "price-guard/${f#./}" "data/ja/${f#./}"; done
policy:
  permissions:
    writeFiles: true
    runCommands: true
    unrestrictedNetwork: false
  limits:
    maxBudgetUsd: 0.5
  promotion:
    minEvalScore: 0.9
environments:
  local:
    cloud: local
    identity:
      bootstrapAdmin: admin@localhost.test
